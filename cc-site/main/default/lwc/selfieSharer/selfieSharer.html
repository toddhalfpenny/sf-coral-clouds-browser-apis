<template>
  <div class="camera">
    <lightning-card>
      <div slot="actions">
        <lightning-button label="Start Camera" class="slds-m-left_xx-small" onclick={startCamera}></lightning-button>
        <lightning-button label="Take Photo" class="slds-m-left_xx-small" onclick={captureImage}></lightning-button>
			  <lightning-button label="Share Photo" class="slds-m-left_xx-small" onclick={shareImage}></lightning-button>
      </div>

		  <div class="slds-grid slds-gutters">
        <video lwc:ref="video" class="videoElement" >Video stream not available.</video>
        <canvas lwc:ref="canvas" class="slds-hide"> </canvas>
      </div>
      <div class="output">
        <img lwc:ref="photo" alt="The screen capture will appear in this box." src="" class="slds-hide" />
      </div>
    </lightning-card>
  </div>

</template>
